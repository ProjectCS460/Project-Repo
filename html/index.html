<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Tickets</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="styleSheets" href="styleSheets/index.css">
    </head>
    <body>
        <main>
            <section id="loginSection" >
                <form id="loginForm" >
                    <label for="userName">Enter your User Name</label>
                    <input type="text" id="userName" name="userName" required><br>
                    <label for="userPass">Enter your password</label>
                    <input type="text" id="userPass" required>
                </form>
            </section>
            <section id="newTicketSection" >
                <form id="newTicketForm" >
                    <label for="ticketTopic">What is the topic of your ticket?</label><br>
                    <input type="text" id="ticketTopic" required name="ticketTopic"><br>
                    <label for="ticketBody">Please describe the issue:</label><br>
                    <input type="text" id="ticketBody" required name="ticketBody"><br>
                </form>
            </section>
            <section id="previousTicketsSection" ></section>
            </main>
        </main>
    </body>
</html>
